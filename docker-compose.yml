services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zhiheng
      POSTGRES_USER: zhiheng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhiheng_local_demo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiheng -d zhiheng"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://zhiheng:${POSTGRES_PASSWORD:-zhiheng_local_demo}@postgres:5432/zhiheng
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.moonshot.cn/v1}
      LLM_MODEL: ${LLM_MODEL:-kimi-k2.5}
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - app-data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "default"]
    environment:
      DATABASE_URL: postgresql+psycopg://zhiheng:${POSTGRES_PASSWORD:-zhiheng_local_demo}@postgres:5432/zhiheng
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.moonshot.cn/v1}
      LLM_MODEL: ${LLM_MODEL:-kimi-k2.5}
    volumes:
      - app-data:/app/backend/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  app-data:
